    <rect x="60" y="194" width="299" height="111" rx="14" fill="#171714" stroke="#d8c4ac" stroke-opacity=".35"/><rect x="421" y="194" width="274" height="111" rx="14" fill="#171714" stroke="#d8c4ac" stroke-opacity=".35"/>
    <text x="209" y="243" font-size="30" text-anchor="middle" font-weight="700">Equipment data</text><text x="209" y="278" font-size="24" text-anchor="middle" font-weight="700">Five failure modes</text>
    <text x="558" y="244" font-size="28" text-anchor="middle" font-weight="700">Prepare features</text><text x="558" y="278" font-size="24" text-anchor="middle" font-weight="700">SMOTE</text>
