<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Equipment failure classification study</title>
  <desc id="desc">Equipment data is prepared for comparison across neural networks, decision trees, and logical analysis in a five-mode classification study.</desc>
