<text x="30" y="40" fill="#10263b" font-size="28" font-weight="700" text-anchor="start">One simulated bus, four steps in the loop</text>
<text x="30" y="68" fill="#456078" font-size="16" font-weight="400" text-anchor="start">Read the bus, estimate what comes next, act within limits, verify the effect.</text>
