<text x="326" y="125" fill="#087a6b" font-size="13" font-weight="700" text-anchor="start">01</text>
<text x="353" y="128" fill="#10263b" font-size="20" font-weight="700" text-anchor="start">Monitor</text>
<text x="326" y="156" fill="#456078" font-size="15" font-weight="400" text-anchor="start">Live readings and history</text>
