<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">DriveTwin at a glance</title><desc id="desc">A simulated bus sends observations to the twin. The twin can send a guarded action back and verify its effect.</desc>
