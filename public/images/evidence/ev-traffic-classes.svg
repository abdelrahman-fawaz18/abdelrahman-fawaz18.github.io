font-weight="bold" text-anchor="middle">Evaluate</text><text x="1015" y="345" font-size="17" text-anchor="middle">Delivery and latency</text><text x="1015" y="373" font-size="17" text-anchor="middle">under background load</text><text x="55" y="587" font-size="16" fill="#5a5b52">ns-3 / 5G-LENA model · prioritization redistributes congestion impact; it does not remove capacity limits.</text></g></svg>
