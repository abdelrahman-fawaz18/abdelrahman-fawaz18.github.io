<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Eight-station production-line model</title>
  <desc id="desc">Three part streams enter a schematic row of eight modeled stations. The layout illustrates the model scope without specifying the real plant topology.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#eee4da" stroke-opacity=".10"/>
    </pattern>
  </defs>
  <rect width="1080" height="500" fill="#302922"/>
  <rect width="1080" height="500" fill="url(#grid)"/>
  <g font-family="Arial,sans-serif" fill="#eee4da">
